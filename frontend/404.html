<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada - Barbearia</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0D">
<!-- Caminhos absolutos: esta pagina responde em qualquer endereco (ex.: /testes/x). -->
<link rel="icon" href="/assets/icone.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fontes.css">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<div class="grao" aria-hidden="true"></div>

<header class="painel-capa">
  <div class="envelope">
    <span class="rotulo">Erro 404</span>
    <h1>Página não encontrada</h1>
  </div>
</header>

<main class="painel">
  <div class="envelope pagina-404">
    <p>O endereço que você abriu não existe ou não faz parte do site.</p>
    <a class="botao botao-ouro" href="/">
      <span>Voltar ao início</span>
      <span class="seta" aria-hidden="true">&rarr;</span>
    </a>
  </div>
</main>

</body>
</html>
