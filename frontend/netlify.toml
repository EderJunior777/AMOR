# Site estatico: nao ha build, os arquivos ja estao prontos na raiz.
# A pasta de funcoes traz a agenda (a trava de horarios).

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# "publish = ." publica a pasta inteira como arquivos estaticos. O que nao e
# do site (testes, codigo das funcoes, package*.json, README) responde 404.
# As funcoes em si continuam funcionando: rodam em /api/* e nao dependem
# destes caminhos estaticos.
[[redirects]]
  from = "/testes/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/agenda.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Cabecalhos de seguranca para todo o site. A CSP so aceita arquivos do
# proprio dominio: nada de script ou estilo dentro do HTML.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
