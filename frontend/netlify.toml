# Site estatico: nao ha build, os arquivos ja estao prontos na raiz.
# A pasta de funcoes traz a agenda (a trava de horarios).

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/agenda.html"
  [headers.values]
    X-Robots-Tag = "noindex"
