<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Poste de barbeiro">
  <defs>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFCB8C"/>
      <stop offset=".5" stop-color="#D8AC5E"/>
      <stop offset="1" stop-color="#8A6A2E"/>
    </linearGradient>
    <clipPath id="tubo">
      <rect x="196" y="128" width="120" height="256" rx="60"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0A0A0D"/>

  <!-- listras do poste, na diagonal, dentro do tubo -->
  <g clip-path="url(#tubo)">
    <rect x="196" y="128" width="120" height="256" fill="#15151A"/>
    <g transform="rotate(-38 256 256)">
      <rect x="60" y="-40" width="392" height="30" fill="url(#ouro)"/>
      <rect x="60" y="20"  width="392" height="30" fill="#F4F0E8"/>
      <rect x="60" y="80"  width="392" height="30" fill="url(#ouro)"/>
      <rect x="60" y="140" width="392" height="30" fill="#F4F0E8"/>
      <rect x="60" y="200" width="392" height="30" fill="url(#ouro)"/>
      <rect x="60" y="260" width="392" height="30" fill="#F4F0E8"/>
      <rect x="60" y="320" width="392" height="30" fill="url(#ouro)"/>
      <rect x="60" y="380" width="392" height="30" fill="#F4F0E8"/>
      <rect x="60" y="440" width="392" height="30" fill="url(#ouro)"/>
    </g>
  </g>

  <!-- vidro do tubo -->
  <rect x="196" y="128" width="120" height="256" rx="60" fill="none" stroke="#2B2F36" stroke-width="8"/>

  <!-- tampas de cima e de baixo -->
  <rect x="172" y="92"  width="168" height="44" rx="22" fill="url(#ouro)"/>
  <rect x="172" y="376" width="168" height="44" rx="22" fill="url(#ouro)"/>
</svg>
